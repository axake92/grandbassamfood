<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Grand Bassam Food — Cuisines africaines authentiques, service traiteur sur mesure à Rennes et alentours." />
    <meta property="og:title" content="Grand Bassam Food — Traiteur Africain Rennes" />
    <meta property="og:description" content="La richesse culinaire de l'Afrique, cuisinée avec amour. Devis sur mesure." />
    <meta property="og:image" content="/logo.png" />
    <title>Grand Bassam Food — Traiteur Africain · Rennes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Netlify Forms: formulaire caché pour détection au build -->
    <!-- Les soumissions sont envoyées à devis@grandbassamfood.fr via dashboard Netlify -->
    <form name="devis" netlify netlify-honeypot="bot-field" hidden>
      <input type="text"  name="nom" />
      <input type="email" name="email" />
      <input type="tel"   name="tel" />
      <input type="text"  name="typeEvent" />
      <input type="date"  name="date" />
      <input type="text"  name="nbPersonnes" />
      <input type="text"  name="lieu" />
      <input type="text"  name="plats" />
      <input type="text"  name="budget" />
      <textarea           name="message"></textarea>
      <input type="text"  name="bot-field" />
    </form>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
